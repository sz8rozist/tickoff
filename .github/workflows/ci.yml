name: CI

on:
  push:
    branches: [main]
  pull_request:

# Egy ágon egyszerre csak a legfrissebb futás számít
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  widget:
    name: Widget (típusellenőrzés + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # tsc --noEmit, majd vite build
      - run: npm run build

  web:
    name: Alkalmazás (típusellenőrzés + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      # A build nem kér adatbázist (minden végpont kérésenként fut)
      - run: npm run build

  docker:
    name: Docker image és compose-fájlok
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Alkalmazás image (felület + API + widget)
        run: docker build -f web/Dockerfile -t tickoff-app .

      - name: Compose-fájlok érvényesek
        env:
          # Csak a kötelező változók kitöltéséhez: a config parancs nem indít semmit
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: ci
          TICKOFF_JWT_SECRET: ci-only-not-a-real-secret-0123456789
          TICKOFF_PUBLIC_URL: https://ci.example.com
          TICKOFF_SITE_ADDRESS: ci.example.com
          TICKOFF_ACME_EMAIL: ci@example.com
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.prod.yml config -q
