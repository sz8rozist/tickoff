name: CI

on:
  push:
    branches: [main]
  pull_request:

# Egy ágon egyszerre csak a legfrissebb futás számít
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + tesztek)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    # A generált Spring-kontextus teszt (contextLoads) valódi adatbázist és a Flyway-migrációkat kéri
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tickoff
          MYSQL_USER: tickoff
          MYSQL_PASSWORD: tickoff
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_URL: jdbc:mysql://localhost:3306/tickoff
      DB_USER: tickoff
      DB_PASSWORD: tickoff
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build és tesztek
        run: ./mvnw -B verify

      - name: Teszt-jelentések feltöltése hiba esetén
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          if-no-files-found: ignore

  frontend:
    name: Dashboard és widget (típusellenőrzés + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Mindkét workspace: tsc --noEmit, majd vite build
      - run: npm run build

  web:
    name: Next.js alkalmazás (típusellenőrzés + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      # A build nem kér adatbázist (minden végpont kérésenként fut)
      - run: npm run build

  docker:
    name: Docker image-ek és compose-fájlok
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Backend image
        run: docker build -t tickoff-backend backend

      # A Dockerfile.web a Caddyfile-t is érvényesíti építéskor
      - name: Web image (dashboard + widget + Caddy)
        run: docker build -f Dockerfile.web -t tickoff-web .

      - name: Next.js alkalmazás image (felület + API + widget)
        run: docker build -f web/Dockerfile -t tickoff-app .

      - name: Compose-fájlok érvényesek
        env:
          # Csak a kötelező változók kitöltéséhez: a config parancs nem indít semmit
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: ci
          TICKOFF_JWT_SECRET: ci-only-not-a-real-secret-0123456789
          TICKOFF_PUBLIC_URL: https://ci.example.com
          TICKOFF_SITE_ADDRESS: ci.example.com
          TICKOFF_ACME_EMAIL: ci@example.com
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.prod.yml config -q
          docker compose -f docker-compose.next.yml config -q
