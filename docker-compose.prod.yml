# Production stack. Indítás:  docker compose -f docker-compose.prod.yml up -d --build
# A beállításokat a .env fájlból olvassa (minta: .env.example). A kötelező változók hiányában nem indul el.
name: tickoff-prod

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tickoff
      MYSQL_USER: tickoff
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Állítsd be a MYSQL_PASSWORD-öt a .env fájlban}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Állítsd be a MYSQL_ROOT_PASSWORD-öt a .env fájlban}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    # Nincs kiadott port: az adatbázis csak a belső hálózaton érhető el.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/tickoff?useUnicode=true&characterEncoding=utf8
      DB_USER: tickoff
      DB_PASSWORD: ${MYSQL_PASSWORD}
      TICKOFF_JWT_SECRET: ${TICKOFF_JWT_SECRET:?Állítsd be a TICKOFF_JWT_SECRET-et a .env fájlban}
      DASHBOARD_ORIGIN: ${TICKOFF_PUBLIC_URL:?Állítsd be a TICKOFF_PUBLIC_URL-t a .env fájlban}
      TICKOFF_STORAGE_DIR: /data/screenshots
      TICKOFF_REGISTRATION_ENABLED: ${TICKOFF_REGISTRATION_ENABLED:-true}
      # E-mail (jelszó-visszaállítás, értesítések). SMTP_HOST nélkül az e-mailek nem mennek el.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      TICKOFF_MAIL_FROM: ${TICKOFF_MAIL_FROM:-Tickoff <no-reply@localhost>}
    volumes:
      - screenshots:/data/screenshots
    # Nincs kiadott port: kívülről csak a web (Caddy) éri el.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TICKOFF_SITE_ADDRESS: ${TICKOFF_SITE_ADDRESS:?Állítsd be a TICKOFF_SITE_ADDRESS-t a .env fájlban}
      TICKOFF_ACME_EMAIL: ${TICKOFF_ACME_EMAIL:?Állítsd be a TICKOFF_ACME_EMAIL-t a .env fájlban}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # A kapott tanúsítványok: ne vesszenek el újraindításkor (a Let's Encrypt-nek kérésszám-korlátja van)
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mysql-data:
  screenshots:
  caddy-data:
  caddy-config:
