<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tickoff widget – demo oldal</title>
    <style>
      body { margin: 0; font-family: Georgia, serif; color: #2b211b; background: #f5f0e6; }
      header { background: #3c281e; color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 16px; }
      header .logo { width: 70px; height: 24px; background: #f0c878; border-radius: 4px; }
      header nav a { color: #f0c878; margin-right: 14px; text-decoration: none; cursor: pointer; }
      header nav a.active { text-decoration: underline; }
      main { max-width: 720px; margin: 0 auto; padding: 32px 24px 120px; }
      .card { background: #fff; border-radius: 10px; padding: 18px; margin: 18px 0; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
      .cta { background: #d93c3c; color: #fff; border: 0; border-radius: 6px; padding: 10px 22px; font-size: 16px; }
    </style>
  </head>
  <body>
    <header>
      <div class="logo" id="logo"></div>
      <!-- Single-page demo: a linkek a History API-val váltanak útvonalat, az oldal nem töltődik újra -->
      <nav>
        <a data-route="/">Főoldal</a>
        <a data-route="/etlap">Étlap</a>
        <a data-route="/kapcsolat">Kapcsolat</a>
      </nav>
    </header>
    <main id="view"></main>

    <script>
      const VIEWS = {
        '/': `
          <h1 id="cim">Demo kávézó</h1>
          <p>Ezen az oldalon próbáljuk ki a Tickoff widgetet. Kattints a jobb alsó „Visszajelzés" gombra.</p>
          <div class="card">
            <h2>Reggeli menü</h2>
            <p>Friss kávé és croissant minden reggel 7 és 10 óra között.</p>
            <button class="cta" id="foglalas">Asztalfoglalás</button>
          </div>`,
        '/etlap': `
          <h1 id="etlap-cim">Étlap</h1>
          <div class="card"><h2>Kávék</h2><p id="kavek">Espresso, cappuccino, flat white.</p></div>
          <div class="card"><h2>Sütemények</h2><p id="sutik">Croissant, almás pite, brownie.</p></div>`,
        '/kapcsolat': `
          <h1 id="kapcsolat-cim">Kapcsolat</h1>
          <div class="card">
            <ul>
              <li>Cím: Minta utca 1.</li>
              <li id="telefon">Telefon: +36 1 234 5678</li>
              <li>E-mail: hello@kavezo.example</li>
            </ul>
          </div>`,
      };

      function render() {
        const view = VIEWS[location.pathname] ?? VIEWS['/'];
        // Késleltetett kirajzolás: a valódi SPA-k is aszinkron töltik be a tartalmat
        document.getElementById('view').innerHTML = '';
        setTimeout(() => { document.getElementById('view').innerHTML = view; }, 150);
        document.querySelectorAll('[data-route]').forEach((a) =>
          a.classList.toggle('active', a.dataset.route === location.pathname));
      }

      document.querySelectorAll('[data-route]').forEach((a) =>
        a.addEventListener('click', () => {
          // A query (pl. a fejlesztői ?token=…) megmarad, így a widget az új "oldalon" is ugyanazzal a projekttel dolgozik
          history.pushState({}, '', a.dataset.route + location.search);
          render();
        }));
      window.addEventListener('popstate', render);
      render();
    </script>

    <!-- Fejlesztéskor a token az URL-ből jön: http://localhost:5174/?token=PROJEKT_TOKEN -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
