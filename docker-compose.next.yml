# Production stack a Next.js változathoz. Indítás:  docker compose -f docker-compose.next.yml --env-file .env.next up -d --build
# A beállításokat a .env.next fájlból olvassa (minta: .env.next.example). A kötelező változók hiányában nem indul el.
# A régi (Java) stack a docker-compose.prod.yml-ben marad, amíg át nem állsz.
name: tickoff-next

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tickoff
      MYSQL_USER: tickoff
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Állítsd be a MYSQL_PASSWORD-öt a .env.next fájlban}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Állítsd be a MYSQL_ROOT_PASSWORD-öt a .env.next fájlban}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    # Nincs kiadott port: az adatbázis csak a belső hálózaton érhető el.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://tickoff:${MYSQL_PASSWORD}@mysql:3306/tickoff
      TICKOFF_JWT_SECRET: ${TICKOFF_JWT_SECRET:?Állítsd be a TICKOFF_JWT_SECRET-et a .env.next fájlban}
      DASHBOARD_ORIGIN: ${TICKOFF_PUBLIC_URL:?Állítsd be a TICKOFF_PUBLIC_URL-t a .env.next fájlban}
      TICKOFF_STORAGE_DIR: /data/screenshots
      TICKOFF_REGISTRATION_ENABLED: ${TICKOFF_REGISTRATION_ENABLED:-true}
      TICKOFF_EXPORT_ZONE: ${TICKOFF_EXPORT_ZONE:-Europe/Budapest}
      # E-mail (jelszó-visszaállítás, értesítések). SMTP_HOST nélkül az e-mailek nem mennek el.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      TICKOFF_MAIL_FROM: ${TICKOFF_MAIL_FROM:-Tickoff <no-reply@localhost>}
    volumes:
      - screenshots:/data/screenshots
    # Nincs kiadott port: kívülről csak a Caddy éri el.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      TICKOFF_SITE_ADDRESS: ${TICKOFF_SITE_ADDRESS:?Állítsd be a TICKOFF_SITE_ADDRESS-t a .env.next fájlban}
      TICKOFF_ACME_EMAIL: ${TICKOFF_ACME_EMAIL:?Állítsd be a TICKOFF_ACME_EMAIL-t a .env.next fájlban}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile.next:/etc/caddy/Caddyfile:ro
      # A kapott tanúsítványok: ne vesszenek el újraindításkor (a Let's Encrypt-nek kérésszám-korlátja van)
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mysql-data:
  screenshots:
  caddy-data:
  caddy-config:
