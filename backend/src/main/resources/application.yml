spring:
  application:
    name: tickoff-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/tickoff?useUnicode=true&characterEncoding=utf8}
    username: ${DB_USER:tickoff}
    password: ${DB_PASSWORD:tickoff}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

tickoff:
  # A dashboard (React) eredete – a widget CORS-át projektenként külön kezeljük
  dashboard-origin: ${DASHBOARD_ORIGIN:http://localhost:5173}
