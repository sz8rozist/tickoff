spring:
  application:
    name: tickoff-backend
  # E-mail (jelszó-visszaállítás, értesítések). SMTP_HOST nélkül az e-mailek nem mennek el.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      # Egy lassú vagy elérhetetlen SMTP-szerver ne akassza meg a küldő szálat
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/tickoff?useUnicode=true&characterEncoding=utf8}
    username: ${DB_USER:tickoff}
    password: ${DB_PASSWORD:tickoff}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  tomcat:
    # Ha a képfeltöltést a Content-Length alapján elutasítjuk (413), a Tomcatnek le kell nyelnie a ki nem olvasott
    # törzset, különben nem küld választ. A korlátot a képméret (3 MB) fölé állítjuk; ennél nagyobb kérésnél
    # a kapcsolat egyszerűen megszakad.
    max-swallow-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

tickoff:
  mail:
    from: ${TICKOFF_MAIL_FROM:Tickoff <no-reply@localhost>}
  registration:
    # Nyilvános regisztráció. Élesben a saját fiók létrehozása után érdemes kikapcsolni (TICKOFF_REGISTRATION_ENABLED=false).
    enabled: ${TICKOFF_REGISTRATION_ENABLED:true}
  webhook:
    # Engedélyezi a privát/loopback webhook-címeket és a sima http-t. CSAK fejlesztéshez: élesben SSRF-kockázat.
    allow-private: ${TICKOFF_WEBHOOK_ALLOW_PRIVATE:false}
  rate-limit:
    # Kérésszám-korlát a widget és az auth végpontokon (lásd io.tickoff.ratelimit.RateLimits)
    enabled: ${TICKOFF_RATE_LIMIT_ENABLED:true}
  # Itt tároljuk a widgetből feltöltött képernyőképeket
  storage-dir: ${TICKOFF_STORAGE_DIR:./data/screenshots}
  jwt:
    # HS256 titok, legalább 32 bájt. Élesben kötelező környezeti változóból megadni!
    secret: ${TICKOFF_JWT_SECRET:dev-only-secret-change-me-in-production-32b}
    ttl: ${TICKOFF_JWT_TTL:12h}
  # A dashboard (React) eredete – a widget CORS-át projektenként külön kezeljük
  dashboard-origin: ${DASHBOARD_ORIGIN:http://localhost:5173}
