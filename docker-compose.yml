# Fejlesztői szolgáltatások az alkalmazáshoz (web/): MySQL és levelezés-csapda. Az alkalmazást magát a gépen futtatod
# (cd web && npm run dev), lásd a README-t. Indítás:  docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: tickoff-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tickoff
      MYSQL_USER: tickoff
      MYSQL_PASSWORD: tickoff
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-web-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Fejlesztői levelezés-csapda: minden elküldött levelet elkap, és megmutatja a http://127.0.0.1:8025 címen.
  # Valódi címzettnek semmi nem megy el.
  mailpit:
    image: axllent/mailpit:latest
    container_name: tickoff-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      # SMTP a helyben futó alkalmazásnak, a konténeren kívülről
      - "127.0.0.1:1025:1025"

volumes:
  # A név a korábbi elnevezésből maradt, hogy a meglévő fejlesztői adat ne vesszen el
  mysql-web-data:
