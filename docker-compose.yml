services:
  mysql:
    image: mysql:8.4
    container_name: tickoff-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tickoff
      MYSQL_USER: tickoff
      MYSQL_PASSWORD: tickoff
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # A Next.js változat (web/) saját adatbázisa: külön szolgáltatás, hogy a Java backend adatait ne érintse.
  mysql-web:
    image: mysql:8.4
    container_name: tickoff-mysql-web
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tickoff
      MYSQL_USER: tickoff
      MYSQL_PASSWORD: tickoff
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-web-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Fejlesztői levelezés-csapda: minden elküldött levelet elkap, és megmutatja a http://127.0.0.1:8025 címen.
  # Valódi címzettnek semmi nem megy el.
  mailpit:
    image: axllent/mailpit:latest
    container_name: tickoff-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      # SMTP a helyben futó alkalmazásnak (web/), a konténeren kívülről
      - "127.0.0.1:1025:1025"

  backend:
    build: ./backend
    container_name: tickoff-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/tickoff?useUnicode=true&characterEncoding=utf8
      DB_USER: tickoff
      DB_PASSWORD: tickoff
      DASHBOARD_ORIGIN: http://localhost:5173
      TICKOFF_STORAGE_DIR: /data/screenshots
      SMTP_HOST: mailpit
      # Fejlesztéshez: a webhook helyi fogadóra is mehet (élesben ez ki van kapcsolva)
      TICKOFF_WEBHOOK_ALLOW_PRIVATE: "true"
      SMTP_PORT: "1025"
    ports:
      - "8080:8080"
    volumes:
      - screenshots:/data/screenshots

volumes:
  mysql-web-data:
  mysql-data:
  screenshots:
